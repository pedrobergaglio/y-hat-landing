<!doctype html>

<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;color:#fafafa;font-family:"IBM Plex Sans",system-ui,sans-serif;
    background:
      radial-gradient(70% 55% at 18% 0%, rgba(31,106,138,.32) 0%, rgba(31,106,138,0) 70%),
      radial-gradient(60% 50% at 100% 100%, rgba(224,181,116,.08) 0%, rgba(224,181,116,0) 70%),
      linear-gradient(180deg,#0c2b3c 0%,#071e2a 48%,#04141d 100%);
    position:relative}
  .bar{position:absolute;left:64px;right:64px;top:48px;display:flex;justify-content:space-between;align-items:center;
    padding-bottom:18px;border-bottom:1px solid rgba(250,250,250,.2);font-size:22px;color:rgba(250,250,250,.82)}
  .brand{display:flex;align-items:center;gap:14px;font-weight:500;color:#fafafa}
  .brand img{height:30px}
  h1{position:absolute;left:64px;top:150px;margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:132px;line-height:.92;letter-spacing:-.025em}
  .word{position:absolute;left:58px;top:262px;margin:0;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:178px;line-height:.9;letter-spacing:-.03em;color:#e0b574}
  .meta{position:absolute;left:64px;bottom:56px;display:flex;gap:56px}
  .meta div small{display:block;font-size:20px;color:rgba(250,250,250,.68);margin-bottom:6px}
  .meta div b{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:40px;line-height:1.05}
  .mark{position:absolute;right:-40px;top:120px;height:560px;opacity:.07}
  canvas{position:absolute;inset:0;width:1200px;height:630px}
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="bar"><div class="brand"><img src="/hackathon/logo-yhat.svg" alt=""><span>Y-Hat</span></div><span>Segunda edición · Octubre 2026 · FCEN, UBA</span></div>
<h1>Investigathon</h1>
<p class="word">Pensar</p>
<div class="meta">
  <div><small>Cuándo</small><b>16 al 30 de octubre</b></div>
  <div><small>Dónde</small><b>0+Infinito · Exactas, UBA</b></div>
  <div><small>Equipos</small><b>3 o 4 personas</b></div>
</div>
<img class="mark" src="/hackathon/logo-yhat.svg" alt="">
<script>
// same scatter + fitted curve as the hero, one static frame
const ctx=document.getElementById('c').getContext('2d');const w=1200,h=630,t=11,cell=36;
const fract=v=>v-Math.floor(v);const ss=(a,b,x)=>{const k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k)};
const hash2=(x,y)=>[fract(Math.sin(x*127.1+y*311.7)*43758.5453),fract(Math.sin(x*269.5+y*183.3)*43758.5453)];
const model=(x,t)=>0.6+0.13*Math.sin(x*2.9+t*.11)+0.06*Math.sin(x*6.3-t*.08)+0.025*Math.sin(x*13+t*.17);
const mask=(u,v)=>(0.14+0.86*ss(0.18,0.72,u))*(1-ss(0.78,1,Math.abs(v-.5)*2));
ctx.lineWidth=1.2;ctx.strokeStyle='rgb(224,181,116)';ctx.lineCap='round';let px=0,py=model(0,t)*h;
for(let x=6;x<=w+6;x+=6){const y=model(x/w,t)*h;ctx.globalAlpha=.75*mask((x-3)/w,(y+py)/2/h);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();px=x;py=y}
ctx.fillStyle='rgb(250,250,250)';const colw=cell*.8;
for(let ci=-1;ci<Math.ceil(w/colw)+1;ci++)for(let k=0;k<3;k++){const[hx,hy]=hash2(ci,k);const[h2x,h2y]=hash2(ci+31.7,k+7.3);
const xp=(ci+hx)*colw;const yp=model(xp/w,t)*h+(hy+h2x+h2y-1.5)*cell*2.1+cell*.3*Math.sin(t*.28+hx*6.2831);
const r=1.3+h2x*.8;ctx.globalAlpha=.6*(0.45+0.55*(0.5+0.5*Math.sin(t*.4+h2y*6.2831)))*mask(xp/w,yp/h);ctx.beginPath();ctx.arc(xp,yp,r,0,6.2832);ctx.fill()}
</script>
</body></html>
